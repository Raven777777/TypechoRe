name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          # zip 供 tools/e2e.php 解压发布包
          php-version: '8.5'
          extensions: pdo_sqlite, sqlite3, zip
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # 发布包里的 CSS 由 Parcel 压缩 (tools/minify_assets.py), 测试会校验压缩确实生效
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/assets/package-lock.json
      - name: Lint, test, analyze
        shell: pwsh
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        run: ./tools/quality.ps1
